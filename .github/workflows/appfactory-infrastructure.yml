name: AppFactory Infrastructure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".appfactory/pages.json"
      - ".appfactory/worker.json"
      - "backend/**"
      - ".github/workflows/appfactory-infrastructure.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: appfactory-infrastructure-commerce-factory
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=appfactory-api")"
          token="$(jq -r '.value // empty' <<<"$response")"
          if [[ -z "$token" ]]; then
            echo "::error::GitHub did not return an OIDC token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Provision Cloudflare Pages through AppFactory
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail

          jq -e '
            type == "object" and
            (.repository == "Trigenys/trigenys-commerce-factory") and
            (.buildCommand | type == "string" and length > 0) and
            (.outputDirectory | type == "string" and length > 0)
          ' .appfactory/pages.json >/dev/null

          response_file="$(mktemp)"
          http_code="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer $OIDC_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary @.appfactory/pages.json \
              https://appfactory-api.lawrynnjennifer.workers.dev/infrastructure/pages
          )"

          jq . "$response_file"
          [[ "$http_code" == "200" ]] || {
            echo "::error::AppFactory Pages returned HTTP $http_code."
            exit 1
          }

          status="$(jq -r '.status // empty' "$response_file")"
          [[ "$status" == "PROVISIONED" ]] || {
            echo "::error::AppFactory Pages did not report PROVISIONED."
            exit 1
          }

  worker:
    needs: pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=appfactory-api")"
          token="$(jq -r '.value // empty' <<<"$response")"
          if [[ -z "$token" ]]; then
            echo "::error::GitHub did not return an OIDC token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Provision TypeScript Worker through AppFactory
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail

          jq -e '
            type == "object" and
            (.repository == "Trigenys/trigenys-commerce-factory") and
            (.runtime == "typescript-wrangler") and
            (.pagesProject == "trigenys-commerce-factory")
          ' .appfactory/worker.json >/dev/null

          response_file="$(mktemp)"
          http_code="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer $OIDC_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary @.appfactory/worker.json \
              https://appfactory-api.lawrynnjennifer.workers.dev/infrastructure/worker
          )"

          jq . "$response_file"
          [[ "$http_code" == "200" ]] || {
            echo "::error::AppFactory Worker returned HTTP $http_code."
            exit 1
          }

          status="$(jq -r '.status // empty' "$response_file")"
          [[ "$status" == "PROVISIONED" ]] || {
            echo "::error::AppFactory Worker did not report PROVISIONED."
            exit 1
          }

  neon:
    needs: worker
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=appfactory-api")"
          token="$(jq -r '.value // empty' <<<"$response")"
          if [[ -z "$token" ]]; then
            echo "::error::GitHub did not return an OIDC token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Provision Neon database and Managed Better Auth through AppFactory
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          http_code="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer $OIDC_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{"repository":"Trigenys/trigenys-commerce-factory"}' \
              https://appfactory-api.lawrynnjennifer.workers.dev/infrastructure/neon
          )"

          jq . "$response_file"
          [[ "$http_code" == "200" ]] || {
            echo "::error::AppFactory Neon returned HTTP $http_code."
            exit 1
          }

          status="$(jq -r '.status // empty' "$response_file")"
          if [[ "$status" != "PROVISIONED" && "$status" != "ALREADY_CONFIGURED" ]]; then
            echo "::error::AppFactory Neon returned unexpected status $status."
            exit 1
          fi
