name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: commerce_journeys
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - name: Install browser for storefront checks
        id: browser-checks
        run: npx playwright install --with-deps chromium
      - name: Verify fluid login carousel and stable frame on mobile and desktop
        if: ${{ !cancelled() && steps.browser-checks.outcome == 'success' }}
        run: npm run test:auth-carousel
      - name: Retain login carousel screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commerce-auth-carousel
          path: artifacts/auth-carousel/
      - name: Verify merchant app layout, navigation, roles and management actions
        if: ${{ !cancelled() && steps.browser-checks.outcome == 'success' }}
        run: npm run test:workspace
      - name: Retain merchant app screenshots and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commerce-workspace
          path: artifacts/workspace/
      - name: Verify interactive hero on desktop and mobile
        if: ${{ !cancelled() && steps.browser-checks.outcome == 'success' }}
        run: npm run test:hero
      - name: Retain hero interaction screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commerce-hero-interactions
          path: artifacts/hero/
      - name: Verify complete landing, navigation and responsive accessibility
        if: ${{ !cancelled() && steps.browser-checks.outcome == 'success' }}
        run: npm run test:landing
      - name: Retain landing screenshots and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commerce-landing
          path: artifacts/landing/
      - name: Verify motion, scrollytelling and shared page branding
        if: ${{ !cancelled() && steps.browser-checks.outcome == 'success' }}
        run: npm run test:motion-brand
      - name: Retain motion and shared-brand screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commerce-motion-brand
          path: artifacts/motion-brand/
      - name: Verify storefront themes and media transparency
        if: ${{ !cancelled() && steps.browser-checks.outcome == 'success' }}
        run: npm run test:themes
      - name: Retain storefront theme screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commerce-store-themes
          path: artifacts/themes/
      - name: Read-only live runtime diagnostic
        if: ${{ !cancelled() && steps.browser-checks.outcome == 'success' }}
        run: node scripts/diagnose-runtime.mjs
      - name: Verify user journeys and accessibility
        if: ${{ !cancelled() && steps.browser-checks.outcome == 'success' }}
        run: npm run test:journeys
      - name: Verify catalog controls, sticky navigation and visible notifications
        if: ${{ !cancelled() && steps.browser-checks.outcome == 'success' }}
        run: npm run test:catalog
      - name: Retain catalog screenshots and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commerce-catalog-ux
          path: artifacts/catalog/
      - name: Verify Google and merchant social imports
        if: ${{ !cancelled() && steps.browser-checks.outcome == 'success' }}
        run: npm run test:social
      - name: Verify passwordless email link access
        if: ${{ !cancelled() && steps.browser-checks.outcome == 'success' }}
        run: npm run test:magic-link
      - name: Retain email link screenshots and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commerce-magic-link
          path: artifacts/magic-link/
      - name: Verify branded transactional email rendering
        if: ${{ !cancelled() && steps.browser-checks.outcome == 'success' }}
        run: npm run test:auth-emails
      - name: Retain branded email previews and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commerce-auth-emails
          path: artifacts/auth-emails/
      - name: Retain social journey screenshots and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commerce-social-journeys
          path: artifacts/social/
      - name: Retain journey screenshots and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commerce-user-journeys
          path: artifacts/journeys/
      - name: Install backend dependencies
        if: always()
        working-directory: backend
        run: npm install --ignore-scripts
      - name: Validate backend
        if: always()
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/commerce_journeys
        working-directory: backend
        run: npm run check
      - name: Bundle the checked Worker for isolated deployment
        working-directory: backend
        run: npx wrangler deploy --config wrangler.production.jsonc --dry-run --outdir ../artifacts/worker
      - name: Retain the checked Worker bundle
        uses: actions/upload-artifact@v6
        with:
          name: commerce-worker-bundle
          path: artifacts/worker/

