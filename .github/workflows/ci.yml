name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: commerce_journeys
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - name: Install browser for storefront checks
        run: npx playwright install --with-deps chromium
      - name: Verify interactive hero on desktop and mobile
        run: npm run test:hero
      - name: Retain hero interaction screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commerce-hero-interactions
          path: artifacts/hero/
      - name: Verify complete landing, navigation and responsive accessibility
        run: npm run test:landing
      - name: Retain landing screenshots and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commerce-landing
          path: artifacts/landing/
      - name: Verify motion, scrollytelling and shared page branding
        run: npm run test:motion-brand
      - name: Retain motion and shared-brand screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commerce-motion-brand
          path: artifacts/motion-brand/
      - name: Verify storefront themes and media transparency
        run: npm run test:themes
      - name: Read-only live runtime diagnostic
        run: node scripts/diagnose-runtime.mjs
      - name: Verify user journeys and accessibility
        run: npm run test:journeys
      - name: Verify catalog controls, sticky navigation and visible notifications
        run: npm run test:catalog
      - name: Retain catalog screenshots and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commerce-catalog-ux
          path: artifacts/catalog/
      - name: Verify Google and merchant social imports
        run: npm run test:social
      - name: Retain social journey screenshots and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commerce-social-journeys
          path: artifacts/social/
      - name: Retain journey screenshots and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commerce-user-journeys
          path: artifacts/journeys/
      - name: Install backend dependencies
        if: always()
        working-directory: backend
        run: npm install --ignore-scripts
      - name: Validate backend
        if: always()
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/commerce_journeys
        working-directory: backend
        run: npm run check
