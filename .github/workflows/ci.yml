name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: commerce_journeys
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - name: Install browser for storefront checks
        run: npx playwright install --with-deps chromium
      - name: Verify storefront themes and media transparency
        run: npm run test:themes
      - name: Read-only live runtime diagnostic
        run: node scripts/diagnose-runtime.mjs
      - name: Verify user journeys and accessibility
        run: npm run test:journeys
      - name: Retain journey screenshots and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commerce-user-journeys
          path: artifacts/journeys/
      - name: Install backend dependencies
        if: always()
        working-directory: backend
        run: npm install --ignore-scripts
      - name: Validate backend
        if: always()
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/commerce_journeys
        working-directory: backend
        run: npm run check
