name: Commerce Factory rendered visual QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  impact:
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-impact-analysis.yml@151add8b850fb8a81f5ecceaa4fde1505fd9c1a2
    with:
      appfactory_ref: 151add8b850fb8a81f5ecceaa4fde1505fd9c1a2
      config_path: .github/appfactory-impact.json
      mode: auto

  visual-qa:
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'visual-qa') }}
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-visual-qa.yml@151add8b850fb8a81f5ecceaa4fde1505fd9c1a2
    permissions:
      contents: read
    with:
      appfactory_ref: 151add8b850fb8a81f5ecceaa4fde1505fd9c1a2
      config_path: .github/appfactory-visual-qa.json
      checkout_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      install_command: npm install --ignore-scripts --no-audit --no-fund
      build_command: npm run build
      start_command: npm run preview -- --host 127.0.0.1 --port 4173 --strictPort
      server_url: http://127.0.0.1:4173/
